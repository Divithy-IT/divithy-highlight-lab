name: Checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python inventory_videos.py --help
      - run: python analyze_package.py --help
      - run: python render_shorts.py --help
      - run: python censor_profanity.py --help
